name: mcphub-replica-test
x-hub: &hub
  image: mcphub-replica-test:local
  build:
    context: ../../..
    dockerfile: tests/docker/replicas/Dockerfile
  environment: &environment
    USE_DB: 'true'
    DB_URL: postgres://mcphub_test:mcphub_test@postgres:5432/mcphub_test
    DB_SYNCHRONIZE: 'false'
    MCPHUB_REPLICA_MODE: 'true'
    JWT_SECRET: replica-test-jwt-secret-at-least-32-bytes
    ADMIN_PASSWORD: replica-test-password
    MCPHUB_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    MCPHUB_SETTING_PATH: /app/tests/docker/replicas/settings.json
    DB_POOL_SIZE: '20'
    DB_CONNECTION_TIMEOUT: '3000'
    DB_STATEMENT_TIMEOUT: '10000'
    DB_MAX_CONNECTION_RETRIES: '2'
    DB_CONNECTION_RETRY_DELAY: '200'
    DB_HEALTH_CHECK_INTERVAL: '1000'
    DB_DESTROY_TIMEOUT: '1000'
    ENABLE_METRICS: 'true'
    TRUST_PROXY: '1'
  depends_on:
    setup: { condition: service_completed_successfully }
  healthcheck:
    test: [CMD, node, -e, "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 6s
    retries: 30
  stop_grace_period: 15s
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mcphub_test
      POSTGRES_PASSWORD: mcphub_test
      POSTGRES_DB: mcphub_test
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mcphub_test]
      interval: 1s
      timeout: 3s
      retries: 30
  setup:
    <<: *hub
    environment:
      <<: *environment
      DB_SYNCHRONIZE: 'true'
      MCPHUB_REPLICA_MODE: 'false'
    command: [node, dist/db/setup.js]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: { disable: true }
  hub-a:
    <<: *hub
    environment: { <<: *environment, MCPHUB_NODE_ID: a }
    ports: ['127.0.0.1::3000']
  hub-b:
    <<: *hub
    environment: { <<: *environment, MCPHUB_NODE_ID: b }
    ports: ['127.0.0.1::3000']
  proxy:
    image: nginx:alpine
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1::80']
    depends_on:
      hub-a: { condition: service_healthy }
      hub-b: { condition: service_healthy }
  upstream:
    image: mcphub-replica-test:local
    command: [node, tests/docker/replicas/upstream.mjs]
volumes:
  postgres_data:
