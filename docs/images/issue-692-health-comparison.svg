<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="860" fill="#0f172a"/>
  <text x="60" y="72" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Issue #692 — /health before vs after</text>
  <text x="60" y="110" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Left: behavior reported in the issue. Right: behavior after this fix on local smoke test.</text>

  <rect x="60" y="150" width="610" height="640" rx="20" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <rect x="730" y="150" width="610" height="640" rx="20" fill="#111827" stroke="#22c55e" stroke-width="2"/>

  <rect x="90" y="185" width="124" height="38" rx="19" fill="#7f1d1d"/>
  <text x="120" y="211" fill="#fecaca" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Before</text>
  <text x="90" y="258" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">HTTP 503 Unhealthy</text>
  <text x="90" y="292" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="18">GET /health</text>
  <rect x="90" y="320" width="550" height="430" rx="16" fill="#020617" stroke="#334155"/>
  <text x="115" y="360" fill="#f87171" font-family="Menlo, Consolas, monospace" font-size="20">{</text>
  <text x="145" y="400" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"status": "unhealthy",</text>
  <text x="145" y="440" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"message": "Not all enabled MCP servers are ready",</text>
  <text x="145" y="480" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"timestamp": "2026-03-19T13:57:07.309Z"</text>
  <text x="115" y="520" fill="#f87171" font-family="Menlo, Consolas, monospace" font-size="20">}</text>
  <text x="115" y="590" fill="#fca5a5" font-family="Inter, Arial, sans-serif" font-size="18">Problem: partial upstream failures looked the same as a core outage.</text>
  <text x="115" y="626" fill="#fca5a5" font-family="Inter, Arial, sans-serif" font-size="18">No connection counts, no degraded state, noisy for monitoring.</text>

  <rect x="760" y="185" width="106" height="38" rx="19" fill="#14532d"/>
  <text x="790" y="211" fill="#bbf7d0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">After</text>
  <text x="760" y="258" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">HTTP 200 Healthy / 200 Degraded / 503 Unhealthy</text>
  <text x="760" y="292" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="18">GET /health</text>
  <rect x="760" y="320" width="550" height="430" rx="16" fill="#020617" stroke="#334155"/>
  <text x="785" y="360" fill="#4ade80" font-family="Menlo, Consolas, monospace" font-size="20">{</text>
  <text x="815" y="400" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"status": "healthy",</text>
  <text x="815" y="440" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"message": "All enabled MCP servers are ready",</text>
  <text x="815" y="480" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"servers": { "total": 4, "connected": 4, "disconnected": 0 },</text>
  <text x="815" y="520" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="20">"timestamp": "2026-03-21T03:12:05.191Z"</text>
  <text x="785" y="560" fill="#4ade80" font-family="Menlo, Consolas, monospace" font-size="20">}</text>
  <text x="785" y="626" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="18">Fix: health endpoint now reports server counts and distinguishes degraded state.</text>
  <text x="785" y="662" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="18">Core failures (for example DB health in DB mode) still return 503 unhealthy.</text>

  <text x="60" y="826" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">Generated from issue #692 expected/current behavior and local runtime smoke-test output.</text>
</svg>
