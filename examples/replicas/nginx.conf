events {}
http {
  map $http_x_mcphub_affinity $affinity {
    "" $http_x_mcphub_state_id;
    default $http_x_mcphub_affinity;
  }
  map $affinity $pool {
    "" mcphub;
    default mcphub_sticky;
  }
  upstream mcphub {
    server hub-a:3000 max_fails=1 fail_timeout=5s;
    server hub-b:3000 max_fails=1 fail_timeout=5s;
  }
  upstream mcphub_sticky {
    hash $affinity consistent;
    server hub-a:3000 max_fails=1 fail_timeout=5s;
    server hub-b:3000 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    # A failed tool call may already have performed its side effects.
    proxy_next_upstream off;

    location / { proxy_pass http://$pool; }
    location /nodes/a/ { proxy_pass http://hub-a:3000/; }
    location /nodes/b/ { proxy_pass http://hub-b:3000/; }
  }
}
