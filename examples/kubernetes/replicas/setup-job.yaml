apiVersion: batch/v1
kind: Job
metadata:
  name: mcphub-setup
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcphub-setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: setup
          image: samanhappy/mcphub:latest
          imagePullPolicy: Always
          args: [node, dist/db/setup.js]
          envFrom:
            - configMapRef: { name: mcphub-config }
            - secretRef: { name: mcphub-secrets }
          env:
            - { name: DB_SYNCHRONIZE, value: 'true' }
            - { name: MCPHUB_REPLICA_MODE, value: 'false' }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: mcphub-admin, key: ADMIN_PASSWORD }
          volumeMounts:
            - { name: settings, mountPath: /etc/mcphub, readOnly: true }
      volumes:
        - name: settings
          configMap: { name: mcphub-settings }
